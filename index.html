<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My IPO Tracker</title>
<style>
body{margin:0;background:#f5f6f8;color:#111;font-family:Arial,sans-serif}
body.dark{background:#0b0f14;color:#eee}
.app{padding:14px}
h2{margin:0 0 4px}
.sub{color:#777;font-size:12px;margin-bottom:14px}
button{padding:11px 14px;border-radius:9px;border:1px solid #ccc;background:white;margin-right:6px;font-weight:bold}
.dark button{background:#151b23;color:white;border-color:#444}
.box{background:white;border:1px solid #ddd;border-radius:12px;overflow:auto}
.dark .box{background:#121821;border-color:#303846}
table{border-collapse:collapse;min-width:900px;width:100%;font-size:13px}
th,td{padding:11px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}
.dark th,.dark td{border-color:#303846}
th{font-size:11px;color:#777}
.green{color:#16803c;font-weight:bold}
.dark .green{color:#4ade80}
a{color:#2563eb;font-weight:bold}
.note{font-size:11px;color:#777;padding:10px}
</style>
</head>
<body>
<div class="app">
<h2>📊 My IPO Tracker</h2>
<div class="sub">MAINBOARD IPOs only · InvestorGain GMP</div>

<button onclick="refresh()">↻ Refresh</button>
<button onclick="dark()">☾ Dark Mode</button>

<br><br>

<div class="box">
<table>
<thead>
<tr>
<th>IPO</th>
<th>Quality</th>
<th>Price</th>
<th>GMP %</th>
<th>Potential Profit/Lot</th>
<th>Open</th>
<th>Close</th>
<th>Allotment</th>
<th>Source</th>
</tr>
</thead>

<tbody id="data">
<tr><td colspan="9">Loading...</td></tr>
</tbody>
</table>
</div>

<div class="note" id="msg">
Data source: InvestorGain · GMP is indicative and not guaranteed.
</div>
</div>

<script>
const source="https://www.investorgain.com/report/ipo-gmp-live/331/";

function dark(){
 document.body.classList.toggle("dark");
}

function refresh(){
 document.getElementById("msg").innerText=
 "Refresh requested: "+new Date().toLocaleString()+
 " · Open InvestorGain for the latest live data.";
 document.getElementById("data").innerHTML=
 '<tr><td colspan="9">Use InvestorGain link below for current live IPO data.</td></tr>';
}

document.getElementById("data").innerHTML=`
<tr>
<td><b>Mainboard IPOs</b></td>
<td>⭐</td>
<td>—</td>
<td class="green">—</td>
<td class="green">—</td>
<td>—</td>
<td>—</td>
<td>—</td>
<td><a href="${source}" target="_blank">InvestorGain ↗</a></td>
</tr>`;
</script>
</body>
  </html>
