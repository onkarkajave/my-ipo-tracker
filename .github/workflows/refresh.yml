name: Refresh IPO Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install requests pandas lxml beautifulsoup4

      - name: Fetch and parse InvestorGain
        run: |
          python - <<'PY'
          import requests
          import pandas as pd
          import json
          import re
          from io import StringIO
          from datetime import datetime, timezone

          URL = "https://www.investorgain.com/report/ipo-gmp-live/331/"

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Linux; Android 10; Mobile) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0 Mobile Safari/537.36"
              ),
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "en-US,en;q=0.9"
          }

          print("Downloading InvestorGain...")

          response = requests.get(
              URL,
              headers=headers,
              timeout=30
          )

          response.raise_for_status()

          html = response.text

          print("Downloaded characters:", len(html))

          with open(
              "investorgain_debug.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(html)

          print("Trying HTML table parser...")

          tables = pd.read_html(StringIO(html))

          print("Tables found:", len(tables))

          records = []

          # InvestorGain columns:
          #
          # Name
          # GMP
          # Rating
          # Sub
          # Price
          # IPO Size
          # Lot
          # Open
          # Close
          # BoA Dt
          # Listing
          # Updated-On
          # Anchor

          for table_no, df in enumerate(tables):

              print("")
              print("======================================")
              print("TABLE", table_no)
              print("Rows:", len(df))
              print("Columns:", len(df.columns))
              print("Columns:", list(df.columns))
              print("======================================")

              if len(df.columns) < 9:
                  continue

              # Flatten MultiIndex columns if present
              if isinstance(df.columns, pd.MultiIndex):
                  df.columns = [
                      " ".join(
                          str(x)
                          for x in col
                          if str(x).lower() != "nan"
                      ).strip()
                      for col in df.columns
